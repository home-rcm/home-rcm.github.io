<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact &mdash; HOME</title>
  <meta name="description" content="Get in touch with the HOME research team." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <nav class="nav" aria-label="Primary">
      <a href="index.html" class="nav__brand">HOME</a>
      <button class="nav__toggle" id="navToggle" aria-expanded="false" aria-controls="navMenu" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav__menu" id="navMenu">
        <li><a href="about.html">About</a></li>
        <li><a href="platform.html">Platform</a></li>
        <li><a href="team.html">Team</a></li>
        <li><a href="publications.html">Publications</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="section" id="contact">
      <div class="container">
        <h2 class="section__title">Contact Us</h2>
        <p class="section__intro">If you'd like to reach our team, send us a message below.</p>
        <p class="section__intro"><em>(Placeholder form &mdash; not yet connected to send messages.)</em></p>

        <form class="contact-form" id="contactForm">
          <div class="form-row">
            <label for="name">Name <span aria-hidden="true">*</span></label>
            <input type="text" id="name" name="name" required />
          </div>
          <div class="form-row">
            <label for="email">Email <span aria-hidden="true">*</span></label>
            <input type="email" id="email" name="email" required />
          </div>
          <div class="form-row">
            <label for="message">Message <span aria-hidden="true">*</span></label>
            <textarea id="message" name="message" rows="5" required></textarea>
          </div>
          <button type="submit" class="btn btn--primary">Send</button>
        </form>

        <p class="contact-info">Email: <a href="mailto:charmcopd@gmail.com">charmcopd@gmail.com</a></p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> HOME. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
